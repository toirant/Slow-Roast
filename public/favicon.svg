<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A382C" />
      <stop offset="100%" stop-color="#24493A" />
    </linearGradient>
    <linearGradient id="sr-drop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E69A3B" />
      <stop offset="100%" stop-color="#D9633B" />
    </linearGradient>
    <linearGradient id="sr-cone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3EAD9" />
    </linearGradient>
  </defs>

  <!-- Squircle container in signature Slow Roast forest green -->
  <rect width="64" height="64" rx="15" fill="url(#sr-bg)" />
  <!-- Subtle warm gold inner stroke for high contrast on dark and light browser tabs -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" fill="none" stroke="#E69A3B" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Aromatic steam ribbons rising from fresh hot pour-over -->
  <path d="M26 14 C25 11 27.5 9 26.5 6.5" stroke="#E69A3B" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <path d="M38 14 C37 11 39.5 9 38.5 6.5" stroke="#D9633B" stroke-width="2.2" stroke-linecap="round" fill="none" />

  <!-- Dripper top oval rim -->
  <ellipse cx="32" cy="18.5" rx="16" ry="3.5" fill="url(#sr-cone)" />
  <!-- Coffee bed surface inside the cone -->
  <ellipse cx="32" cy="18.5" rx="13.5" ry="2.2" fill="#3D2619" />

  <!-- Pour-over funnel cone -->
  <path d="M16 18.5 L48 18.5 L36.5 35 C35.5 36.4 33.8 37.2 32 37.2 C30.2 37.2 28.5 36.4 27.5 35 Z" fill="url(#sr-cone)" />

  <!-- Fluted spiral ribs on the V60 dripper wall (artisan extraction guide) -->
  <path d="M22 21 C25 25 28 30 29.5 34" stroke="#24493A" stroke-width="1.6" stroke-linecap="round" fill="none" />
  <path d="M32 21 L32 34.5" stroke="#24493A" stroke-width="1.6" stroke-linecap="round" fill="none" />
  <path d="M42 21 C39 25 36 30 34.5 34" stroke="#24493A" stroke-width="1.6" stroke-linecap="round" fill="none" />

  <!-- Brass / golden support collar base -->
  <rect x="24" y="37.5" width="16" height="3" rx="1.5" fill="#E69A3B" />

  <!-- Fresh extracted coffee droplet in warm terracotta-amber -->
  <path d="M32 43 C30 45.8 28 48.2 28 50.8 C28 53.1 29.8 55 32 55 C34.2 55 36 53.1 36 50.8 C36 48.2 34 45.8 32 43 Z" fill="url(#sr-drop)" />
</svg>
