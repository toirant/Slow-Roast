    <script>
      (function() {
        // Prevent third-party browser extensions (e.g. Zerion wallet content-script)
        // from throwing unhandled "Cannot redefine property: isZerion" errors.
        const origDefineProperty = Object.defineProperty;
        Object.defineProperty = function(obj, prop, descriptor) {
          try {
            return origDefineProperty.call(Object, obj, prop, descriptor);
          } catch (err) {
            if (prop === 'isZerion' || (err && String(err).includes('Cannot redefine property'))) {
              return obj;
            }
            throw err;
          }
        };

        const suppressExtensionError = function(e) {
          const msg = e && (e.message || String(e));
          const file = e && (e.filename || '');
          const isExtension =
            file.startsWith('chrome-extension:') ||
            file.startsWith('moz-extension:') ||
            file.includes('in-page.js') ||
            (msg && (msg.includes('isZerion') || msg.includes('Cannot redefine property')));
          if (isExtension) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        };

        window.addEventListener('error', suppressExtensionError, true);
        window.addEventListener('unhandledrejection', function(event) {
          const reason = event && event.reason;
          const msg = reason ? (reason.message || String(reason)) : '';
          const stack = reason && reason.stack ? String(reason.stack) : '';
          if (
            msg.includes('isZerion') ||
            msg.includes('Cannot redefine property') ||
            stack.includes('chrome-extension:')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
